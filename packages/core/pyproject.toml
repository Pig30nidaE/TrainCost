[build-system]
requires = ["setuptools==84.1.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "traincost-ci-core"
version = "0.2.0b1"
description = "Core analysis package for TrainCost CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.urls]
Repository = "https://github.com/Pig30nidaE/TrainCost"
Issues = "https://github.com/Pig30nidaE/TrainCost/issues"

[project.scripts]
traincost-ci = "traincost_ci_core.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "coverage==7.17.1",
  "jsonschema==4.25.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
