name: TrainCost CI

on:
  pull_request:
    paths:
      - "examples/pytorch-demo/config.yaml"

jobs:
  traincost:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TrainCost CI
        id: traincost
        # External consumers pin the reviewed SHA from docs/qa_report.md.
        uses: ./
        with:
          config-path: "examples/pytorch-demo/config.yaml"
          gpu-prices: "T4=0.35,A10G=1.2,A100=3.20"
          budget-limit: "5"
          comment-mode: "false"
          report-path: "report.md"

      - name: Verify demo report
        shell: bash
        env:
          REPORT_PATH: ${{ steps.traincost.outputs.report-path }}
          COMMENT_POSTED: ${{ steps.traincost.outputs.comment-posted }}
          ANALYSIS_STATUS: ${{ steps.traincost.outputs.analysis-status }}
        run: |
          set -euo pipefail

          test -n "$REPORT_PATH"
          test -s "$REPORT_PATH"
          test "$COMMENT_POSTED" = "false"
          test "$ANALYSIS_STATUS" = "complete"

          grep -F -- 'Config: `examples/pytorch-demo/config.yaml`.' "$REPORT_PATH"
          grep -F -- 'Merge-base estimate: $0.04' "$REPORT_PATH"
          grep -F -- 'PR-head estimate: $21.33' "$REPORT_PATH"
          grep -F -- 'Increase: +48,662%' "$REPORT_PATH"

          printf 'Verified report-path output: %s\n' "$REPORT_PATH"
          printf 'Verified comment-posted output: %s\n' "$COMMENT_POSTED"
