name: Feature request
description: Propose a change to the config review workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow and the problem you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
      description: Avoid sharing credentials, private training data, or sensitive configuration.
