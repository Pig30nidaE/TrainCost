name: TrainCost CI

on:
  pull_request:
    paths:
      - "config.yaml"

jobs:
  traincost:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review ML training cost
        # Reviewed public report-only candidate; not a published release tag.
        uses: Pig30nidaE/TrainCost@a907b78423cd18b5e7a8f53f5d092fcba6df77e9
        with:
          config-path: "config.yaml"
          gpu-prices: "T4=0.35,A10G=1.2,A100=3.20"
          budget-limit: "5"
          comment-mode: "false"
          report-path: "report.md"
